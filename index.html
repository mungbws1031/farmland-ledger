<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F3F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111612" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="땅 장부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="manifest" href="manifest.webmanifest">
<title>우리 땅 임대 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 휴대폰 한 손 장부 — 위 머리띠(제목 + 글씨 크기), 가운데 카드, 아래 큰 탭 3개. */
:root {
  --bg: #F3F5F0;
  --surface: #FFFFFF;
  --fg: #1C2620;
  --muted: #55615A;
  --line: #CFD7CB;
  --accent: #2E6A3F;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EEE3;
  --hot: #B3261E;
  --hot-soft: #FBE9E7;
  --warm: #9A5800;
  --warm-soft: #FBF0DE;
  --calm: #55615A;
  --calm-soft: #EEF1EC;
  --kind-a: #2E6A3F;
  --kind-b: #7A4E1D;
  --kind-c: #3F5E73;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", system-ui, sans-serif;
  --base: 21px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #1A211C; --fg: #EAF0EA; --muted: #A3AEA6; --line: #34403A;
    --accent: #8FD19E; --accent-ink: #0E1A12; --accent-soft: #203326; --hot: #FF8F85; --hot-soft: #3A1E1B;
    --warm: #F5B964; --warm-soft: #3A2C15; --calm: #A3AEA6; --calm-soft: #222B24;
    --kind-a: #8FD19E; --kind-b: #E2B07A; --kind-c: #9CC2DC; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #1A211C; --fg: #EAF0EA; --muted: #A3AEA6; --line: #34403A;
  --accent: #8FD19E; --accent-ink: #0E1A12; --accent-soft: #203326; --hot: #FF8F85; --hot-soft: #3A1E1B;
  --warm: #F5B964; --warm-soft: #3A2C15; --calm: #A3AEA6; --calm-soft: #222B24;
  --kind-a: #8FD19E; --kind-b: #E2B07A; --kind-c: #9CC2DC; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: var(--base); padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body.locked { overflow: hidden; }
button, a, .todo, .row { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.6;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(6.2rem + env(safe-area-inset-bottom, 0px));
  font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 44rem; margin: 0 auto; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.3; }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.2rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

/* 머리띠 */
header.top {
  background: var(--bg); padding-block: 0.8rem 0.7rem;
  display: grid; gap: 0.55rem; border-bottom: 2px solid var(--line);
}
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; flex-wrap: wrap; }
.today { color: var(--muted); font-size: 0.85rem; }
.size-row { display: flex; align-items: center; gap: 0.45em; flex-wrap: nowrap; font-size: clamp(15px, 0.85rem, 19px); }
.size-row .lbl { color: var(--muted); }
.size-btn {
  min-width: 3em; min-height: 2.7em; border-radius: 12px; cursor: pointer; font-weight: 700; flex: none;
  border: 2px solid var(--accent); background: var(--surface); color: var(--accent); padding: 0 0.6em;
}
.size-btn:disabled { opacity: 0.35; cursor: default; }
.size-now { font-weight: 700; flex: 1; min-width: 0; text-align: center; white-space: nowrap; }
.refresh { flex: none; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 2.7em; padding: 0 0.8em; cursor: pointer; font-weight: 600; }

main { padding-block: 1.1rem 1rem; display: grid; gap: 1.25rem; }
.lead { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.92rem; }
.notice-bar { background: var(--calm-soft); border-radius: 14px; padding: 0.8rem 1rem; font-size: 0.95rem; color: var(--fg); }
.notice-bar.err { background: var(--hot-soft); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem 1rem; flex-wrap: wrap; }
.count { color: var(--muted); font-size: 0.9rem; }

/* 할 일 카드 */
.todo-list { display: grid; gap: 0.8rem; list-style: none; padding: 0; margin: 0.7rem 0 0; }
.todo {
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  padding: 0.95rem 1rem; display: grid; grid-template-columns: auto 1fr; gap: 0.2rem 0.9rem; align-items: start;
  cursor: pointer; text-align: left; width: 100%;
}
@media (hover: hover) { .todo:hover { border-color: var(--accent); } }
.dday { grid-row: span 3; min-width: 4.8rem; text-align: center; border-radius: 12px; padding: 0.45rem 0.4rem; font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
.dday small { display: block; font-size: 0.68rem; font-weight: 500; margin-top: 0.15rem; }
.u-over .dday, .u-hot .dday { background: var(--hot-soft); color: var(--hot); }
.u-warm .dday { background: var(--warm-soft); color: var(--warm); }
.u-calm .dday { background: var(--calm-soft); color: var(--calm); }
.todo-title { font-weight: 700; font-size: 1.05rem; min-width: 0; }
.todo-place { min-width: 0; }
.todo-plain { color: var(--muted); font-size: 0.9rem; min-width: 0; }

/* 목록 */
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.35rem 1rem; cursor: pointer; font-size: 0.92rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.rows { display: grid; gap: 0.7rem; list-style: none; padding: 0; margin: 0.7rem 0 0; }
.row { width: 100%; text-align: left; cursor: pointer; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 0.9rem 1rem; display: grid; gap: 0.25rem; }
@media (hover: hover) { .row:hover { border-color: var(--accent); } }
.row-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.row-region { font-weight: 700; font-size: 1.05rem; min-width: 0; }
.row-parcels { color: var(--muted); font-size: 0.9rem; min-width: 0; overflow-wrap: anywhere; }
.row-meta { font-size: 0.92rem; display: flex; gap: 0.3rem 1rem; flex-wrap: wrap; }
.pill { font-size: 0.78rem; font-weight: 700; border-radius: 999px; padding: 0.1rem 0.65rem; border: 2px solid currentColor; white-space: nowrap; }
.k-a { color: var(--kind-a); } .k-b { color: var(--kind-b); } .k-c { color: var(--kind-c); } .k-d { color: var(--muted); }
.flag { color: var(--hot); font-weight: 700; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.8rem; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 0.4rem 1.1rem; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }

/* 연락처 */
.contact { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 0.9rem 1rem; display: grid; gap: 0.35rem; }
.phone-line { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.phone { font-size: 1.3rem; font-weight: 700; user-select: all; }
.phone a { color: inherit; text-decoration: none; }
.mini { border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0.2rem 0.75rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; min-height: 2.2rem; }

/* 상세 */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 15, 11, 0.5); z-index: 20; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
}
.sheet-inner { max-width: 44rem; margin: 0 auto; display: grid; gap: 1rem; }
.sheet-head { display: flex; justify-content: space-between; align-items: start; gap: 0.75rem; }
.close { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; min-height: 2.8rem; padding: 0 1rem; font-weight: 700; cursor: pointer; flex: none; }
dl.info { margin: 0; display: grid; grid-template-columns: 7rem 1fr; gap: 0.5rem 0.8rem; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 0.95rem 1rem; }
dl.info dt { color: var(--muted); font-size: 0.92rem; }
dl.info dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.issue-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.issue { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 0.75rem 0.95rem; display: grid; gap: 0.3rem; }
.issue-top { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted); }
.st-open { color: var(--hot); font-weight: 700; } .st-done { color: var(--accent); font-weight: 700; }
.addr { font-weight: 600; overflow-wrap: anywhere; user-select: all; }
.maplink { display: inline-flex; align-items: center; min-height: 2.4rem; border: 2px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 12px; padding: 0.2rem 0.85rem; font-weight: 700; text-decoration: none; font-size: 0.92rem; }
@media (hover: hover) { .maplink:hover { background: var(--accent-soft); } }
.hint { font-size: 0.85rem; color: var(--muted); margin: 0; }

/* 아래 메뉴 */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 2px solid var(--line);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.08);
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-block: 0.45rem calc(0.45rem + env(safe-area-inset-bottom, 0px));
}
nav.tabs .in { max-width: 44rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }
nav.tabs a {
  display: grid; justify-items: center; gap: 0.1rem; padding: 0.45rem 0.2rem; border-radius: 14px;
  text-decoration: none; color: var(--fg); font-weight: 700; font-size: clamp(16px, 0.95rem, 22px); line-height: 1.2; min-height: 3.2rem; white-space: nowrap;
  border: 2px solid transparent;
}
nav.tabs a svg { width: clamp(22px, 1.5rem, 30px); height: clamp(22px, 1.5rem, 30px); }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
@media (hover: hover) { nav.tabs a:not([aria-current="page"]):hover { border-color: var(--line); } }

.credit { text-align: center; color: var(--muted); font-size: 0.82rem; padding-block: 1.5rem 0.5rem; border-top: 1px solid var(--line); margin-top: 1rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 0.6rem 1.2rem; border-radius: 999px; z-index: 30; font-size: 0.95rem; font-weight: 600; }
@media (max-width: 460px) { dl.info { grid-template-columns: 1fr; gap: 0.1rem; } dl.info dd { margin-bottom: 0.5rem; } }
@media (max-width: 380px) { .size-row .lbl { display: none; } }
@media (max-width: 380px) { .dday { min-width: 4.2rem; font-size: 1.05rem; } .todo { padding: 0.8rem; gap: 0.2rem 0.7rem; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up 0.18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: 0.6; } } }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-row">
      <h1>우리 땅 임대 장부</h1>
      <span class="today" id="today"></span>
    </div>
    <div class="size-row" role="group" aria-label="글씨 크기">
      <span class="lbl">글씨</span>
      <button class="size-btn" id="sizeDown" type="button" aria-label="글씨 작게">가 −</button>
      <span class="size-now" id="sizeNow" aria-live="polite"></span>
      <button class="size-btn" id="sizeUp" type="button" aria-label="글씨 크게">가 +</button>
      <button class="refresh" id="refreshBtn" type="button">새로고침</button>
    </div>
  </header>

  <main>
    <div class="notice-bar" id="status">장부를 불러오는 중이에요.</div>

    <section id="view-home" aria-labelledby="h-home">
      <div class="section-head">
        <h2 id="h-home">다가오는 할 일</h2>
        <span class="count" id="homeCount"></span>
      </div>
      <p class="lead">6개월 안에 챙길 날짜와 지난 날짜를 가까운 순서로 보여줘요. 카드를 누르면 자세히 보여요.</p>
      <ul class="todo-list" id="todoList"></ul>
      <div id="checks"></div>
    </section>

    <section id="view-list" aria-labelledby="h-list" hidden>
      <div class="section-head">
        <h2 id="h-list">땅 목록</h2>
        <a class="btn ghost" id="editSheetLink" href="#" target="_blank" rel="noopener">시트에서 고치기</a>
      </div>
      <div class="chips" id="chips" role="group" aria-label="관리 유형으로 거르기"></div>
      <ul class="rows" id="rows"></ul>
    </section>

    <section id="view-contacts" aria-labelledby="h-contacts" hidden>
      <div class="section-head">
        <h2 id="h-contacts">연락처</h2>
      </div>
      <p class="lead">번호를 누르면 전화가 걸려요. 안 되면 '복사'를 눌러 붙여 넣으세요.</p>
      <ul class="rows" id="contacts"></ul>
    </section>
  </main>
  <footer class="credit">만든이: 노미희 2026.11.03 ver.1.0</footer>
</div>

<nav class="tabs" aria-label="메뉴">
  <div class="in">
    <a href="#home" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 14l2.5 2.5L16 12"/></svg>
      할 일
    </a>
    <a href="#list" data-view="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18l5-12 4 8 3-5 6 9z"/><path d="M3 21h18"/></svg>
      땅 목록
    </a>
    <a href="#contacts" data-view="contacts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
      연락처
    </a>
  </div>
</nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  const CFG = window.LEDGER_CONFIG || {};
  // 시트 주소는 저장소에 두지 않고, 가족에게 보낸 링크(?s=시트ID)로 한 번 열면 이 휴대폰이 기억함
  function resolveSheetId() {
    let id = "";
    try { id = (new URLSearchParams(location.search).get("s") || "").trim(); } catch (_) {}
    if (/^[A-Za-z0-9_-]{20,}$/.test(id)) {
      try { localStorage.setItem("farm-sheet", id); } catch (_) {}
      try { history.replaceState(null, "", location.pathname + location.hash); } catch (_) {}
      return id;
    }
    try { id = localStorage.getItem("farm-sheet") || ""; } catch (_) { id = ""; }
    return CFG.sheetId || id;
  }
  const SHEET_ID = resolveSheetId();
  const SHEET_EDIT = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
  const KIND = {
    wituk:   { label: "농지은행 위탁", cls: "k-a" },
    private: { label: "개인 간 임대", cls: "k-b" },
    forest:  { label: "임야", cls: "k-c" },
    self:    { label: "자경", cls: "k-d" },
    idle:    { label: "휴경·미임대", cls: "k-d" }
  };
  const KIND_BY_LABEL = {};
  Object.keys(KIND).forEach((k) => { KIND_BY_LABEL[KIND[k].label.replace(/\s/g, "")] = k; });
  const state = { leases: [], contacts: [], loaded: false, filter: "all", loading: false };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- 날짜 ---------- */
  function normDate(s) {
    const m = String(s || "").trim().match(/^(\d{4})[-./ ]\s*(\d{1,2})[-./ ]\s*(\d{1,2})/);
    return m ? m[1] + "-" + m[2].padStart(2, "0") + "-" + m[3].padStart(2, "0") : "";
  }
  function parseD(s) { const n = normDate(s); if (!n) return null; const p = n.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function today0() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function fmt(d) { return d ? d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate() : "—"; }
  function diffDays(d) { return Math.round((d - today0()) / 86400000); }
  function addMonths(d, n) { const r = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate(); r.setDate(Math.min(d.getDate(), last)); return r; }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function years(a, b) { return (b - a) / (365.25 * 86400000); }
  function ddayText(n) { return n === 0 ? "오늘" : n > 0 ? "D-" + n : "D+" + (-n); }
  function urgency(n) { return n < 0 ? "over" : n <= 30 ? "hot" : n <= 90 ? "warm" : "calm"; }

  /* ---------- 법정 기한 ---------- */
  function deadlines(L) {
    const out = [];
    const start = parseD(L.start), end = parseD(L.end);
    if (L.customDeadline) {
      const d = parseD(L.customDeadline);
      if (d) out.push({ type: "custom", date: d, title: L.customDeadlineLabel || "따로 챙길 날짜", plain: "직접 정한 날짜예요.", overPlain: "정한 날짜가 지났어요. 처리했으면 시트에서 지워 주세요.", basis: "직접 입력" });
    }
    if (L.kind === "private") {
      if (end && !L.noticeDone) out.push({ type: "notice", date: addMonths(end, -3), title: "계약 끝낼지 임차인에게 말하는 마감", plain: "이날까지 말하지 않으면 같은 조건, 같은 기간으로 자동 연장돼요.", overPlain: "기한이 지났어요. 같은 조건으로 자동 연장된 것으로 봐요.", basis: "농지법 제25조" });
      if (start && !L.reportedAt) out.push({ type: "report", date: addDays(start, 60), title: "농지대장 신고 마감", plain: "읍·면사무소에 임대차 신고를 해야 해요. 안 하면 과태료 대상이에요.", overPlain: "신고 기한이 지났어요. 신고했으면 시트에 신고일을 적어 주세요.", basis: "농지법 제49조의2" });
    }
    if (end) out.push({ type: "end", date: end, title: L.kind === "wituk" ? "위탁 계약 만료" : "계약 만료", plain: L.kind === "wituk" ? "갱신할지, 임차인을 바꿀지 지사와 미리 정해요." : "계약이 끝나는 날이에요.", overPlain: L.kind === "wituk" ? "만료일이 지났어요. 위탁이 갱신됐는지 지사에 확인해 주세요." : "만료일이 지났어요. 연장됐는지 확인해 주세요.", basis: "계약서" });
    return out;
  }
  function checksFor(L) {
    const issues = [];
    const start = parseD(L.start), end = parseD(L.end);
    if (["wituk", "private", "forest"].includes(L.kind) && !end) issues.push("만료일이 비어 있어요");
    if (L.kind === "private" && start && end) {
      const min = L.facility ? 5 : 3;
      if (years(start, end) < min - 0.01) issues.push("계약 기간이 법정 최소 " + min + "년보다 짧아요");
    }
    const open = L.issues.filter((i) => i.status !== "done").length;
    if (open) issues.push("처리 중인 현장 문제 " + open + "건");
    return issues;
  }
  function nextDeadline(L) {
    return deadlines(L).map((d) => Object.assign(d, { n: diffDays(d.date) })).filter((d) => d.n >= 0).sort((a, b) => a.n - b.n)[0] || null;
  }

  /* ---------- 구글 시트 읽기 ---------- */
  function loadTab(tab) {
    return new Promise((resolve, reject) => {
      const cb = "__sheet_" + Math.random().toString(36).slice(2);
      const s = document.createElement("script");
      const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
      function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (_) { window[cb] = undefined; } s.remove(); }
      window[cb] = (resp) => { cleanup(); if (!resp || resp.status === "error") reject(new Error("sheet")); else resolve(resp.table); };
      s.onerror = () => { cleanup(); reject(new Error("load")); };
      s.src = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(SHEET_ID) + "/gviz/tq?headers=1&tqx=responseHandler:" + cb + "&sheet=" + encodeURIComponent(tab) + "&_=" + Date.now();
      document.head.appendChild(s);
    });
  }
  function tableRows(table) {
    const labels = table.cols.map((c) => String(c.label || "").trim());
    return table.rows.map((r) => {
      const o = {};
      labels.forEach((lab, i) => {
        const cell = r.c && r.c[i];
        let v = cell ? (cell.f != null ? cell.f : cell.v) : "";
        o[lab] = v == null ? "" : String(v);
      });
      return o;
    });
  }
  const pick = (o, prefix) => { const k = Object.keys(o).find((x) => x.replace(/\s/g, "").startsWith(prefix.replace(/\s/g, ""))); return k ? o[k].trim() : ""; };
  const yes = (s) => /^(예|네|o|y|yes|true|있음|완료)$/i.test(String(s).trim());
  const lines = (s) => String(s || "").split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
  function toLease(o, i) {
    const addresses = lines(pick(o, "지도 주소"));
    const codes = lines(pick(o, "필지 고유번호"));
    const parcelCodes = {};
    addresses.forEach((a, j) => { if (codes[j]) parcelCodes[a] = codes[j].replace(/\D/g, ""); });
    const issues = lines(pick(o, "현장 기록")).map((ln) => {
      const p = ln.split("/").map((x) => x.trim());
      if (p.length >= 3) return { date: normDate(p[0]), status: /해결|완료/.test(p[1]) ? "done" : "open", text: p.slice(2).join(" / ") };
      return { date: normDate(p[0]), status: "open", text: p.length > 1 ? p.slice(1).join(" / ") : ln };
    });
    return {
      id: "row" + (i + 2),
      region: pick(o, "땅 이름"), parcels: pick(o, "지번"),
      kind: KIND_BY_LABEL[pick(o, "관리 유형").replace(/\s/g, "")] || "idle",
      start: normDate(pick(o, "계약 시작일")), end: normDate(pick(o, "계약 만료일")),
      tenant: pick(o, "임차인"), phone: pick(o, "임차인 전화"), rent: pick(o, "임대료"), area: pick(o, "면적").replace(/[^\d.]/g, ""),
      note: pick(o, "메모"), facility: yes(pick(o, "시설")), noticeDone: yes(pick(o, "통지 완료")), reportedAt: normDate(pick(o, "농지대장 신고일")),
      customDeadline: normDate(pick(o, "따로 챙길 날짜")), customDeadlineLabel: pick(o, "그날 할 일"),
      addresses, parcelCodes, issues
    };
  }
  async function load(silent) {
    if (state.loading) return;
    state.loading = true;
    if (!silent) setStatus("장부를 불러오는 중이에요.");
    try {
      const [land, contacts] = await Promise.all([loadTab(CFG.landTab || "땅 목록"), loadTab(CFG.contactTab || "연락처")]);
      // 임차인 칸이 '임차인 전화'와 헷갈리지 않도록 정확히 맞춤
      state.leases = tableRows(land).map((o, i) => {
        const L = toLease(o, i);
        const tenantKey = Object.keys(o).find((k) => k.replace(/\s/g, "") === "임차인");
        L.tenant = tenantKey ? o[tenantKey].trim() : "";
        return L;
      }).filter((L) => L.region);
      state.contacts = tableRows(contacts).map((o) => ({ name: pick(o, "이름"), phone: pick(o, "전화"), memo: pick(o, "메모") })).filter((c) => c.name || c.phone);
      state.loaded = true;
      setStatus("");
      renderAll();
      if (sheetFor) { if (state.leases.some((x) => x.id === sheetFor)) drawSheet(); else closeSheet(); }
      if (silent === "manual") toast("새로 불러왔어요");
    } catch (e) {
      setStatus("장부를 불러오지 못했어요. 인터넷 연결을 확인하거나, 구글 시트가 '링크가 있는 모든 사용자 - 뷰어'로 공유되어 있는지 확인해 주세요.", true);
    } finally { state.loading = false; }
  }

  /* ---------- 화면: 할 일 ---------- */
  function renderHome() {
    const items = [];
    state.leases.forEach((L) => deadlines(L).forEach((d) => { const n = diffDays(d.date); if (n <= 180) items.push({ L, d, n }); }));
    items.sort((a, b) => a.n - b.n);
    $("homeCount").textContent = state.loaded ? items.length + "건" : "";
    const list = $("todoList");
    if (!state.loaded) { list.innerHTML = ""; $("checks").innerHTML = ""; return; }
    list.innerHTML = items.length ? items.map(({ L, d, n }) =>
      '<li><button type="button" class="todo u-' + urgency(n) + '" data-open="' + esc(L.id) + '">' +
      '<span class="dday">' + ddayText(n) + "<small>" + fmt(d.date) + "</small></span>" +
      '<span class="todo-title">' + esc(d.title) + "</span>" +
      '<span class="todo-place">' + esc(L.region) + (L.tenant ? " · " + esc(L.tenant) : "") + "</span>" +
      '<span class="todo-plain">' + esc(n < 0 ? d.overPlain : d.plain) + "</span></button></li>").join("")
      : '<li class="notice-bar">' + (state.leases.length ? "6개월 안에 챙길 날짜가 없어요." : "아직 등록된 땅이 없어요. '땅 목록'의 '시트에서 고치기'로 시트에 적어 주세요.") + "</li>";
    const flagged = state.leases.map((L) => ({ L, c: checksFor(L) })).filter((x) => x.c.length);
    $("checks").innerHTML = flagged.length ? '<div class="section-head" style="margin-top:1.4rem"><h2>살펴볼 것</h2><span class="count">' + flagged.length + '곳</span></div><ul class="rows">' +
      flagged.map(({ L, c }) => '<li><button type="button" class="row" data-open="' + esc(L.id) + '"><span class="row-region">' + esc(L.region) + '</span><span class="row-meta flag">' + c.map(esc).join(" · ") + "</span></button></li>").join("") + "</ul>" : "";
  }

  /* ---------- 화면: 목록 ---------- */
  function renderList() {
    const counts = { all: state.leases.length };
    state.leases.forEach((L) => { counts[L.kind] = (counts[L.kind] || 0) + 1; });
    const opts = [["all", "전체"]].concat(Object.keys(KIND).filter((k) => counts[k]).map((k) => [k, KIND[k].label]));
    $("chips").innerHTML = opts.map(([k, label]) => '<button type="button" class="chip" data-filter="' + k + '" aria-pressed="' + (state.filter === k) + '">' + label + " " + (counts[k] || 0) + "</button>").join("");
    const rows = state.leases.filter((L) => state.filter === "all" || L.kind === state.filter).slice().sort((a, b) => (a.end || "9999").localeCompare(b.end || "9999"));
    $("rows").innerHTML = !state.loaded ? "" : rows.length ? rows.map((L) => {
      const k = KIND[L.kind] || KIND.idle;
      const end = parseD(L.end);
      const nd = nextDeadline(L);
      return '<li><button type="button" class="row" data-open="' + esc(L.id) + '">' +
        '<span class="row-top"><span class="row-region">' + esc(L.region) + '</span><span class="pill ' + k.cls + '">' + k.label + "</span></span>" +
        '<span class="row-parcels">' + esc(L.parcels) + "</span>" +
        '<span class="row-meta"><span>만료 ' + fmt(end) + (end ? " (" + ddayText(diffDays(end)) + ")" : "") + "</span>" +
        (L.tenant ? "<span>임차인 " + esc(L.tenant) + "</span>" : "") +
        (nd && nd.type !== "end" ? '<span class="flag">' + esc(nd.title) + " " + ddayText(nd.n) + "</span>" : "") + "</span></button></li>";
    }).join("") : '<li class="notice-bar">이 유형으로 등록된 땅이 없어요.</li>';
  }

  /* ---------- 화면: 연락처 ---------- */
  function telHref(p) { return "tel:" + String(p).replace(/[^0-9+]/g, ""); }
  function renderContacts() {
    $("contacts").innerHTML = !state.loaded ? "" : state.contacts.length ? state.contacts.map((c) =>
      '<li class="contact"><span class="row-region">' + esc(c.name) + '</span><span class="phone-line"><span class="phone"><a href="' + esc(telHref(c.phone)) + '">' + esc(c.phone) + '</a></span><button type="button" class="mini" data-copy="' + esc(c.phone) + '">복사</button></span>' +
      (c.memo ? '<span class="row-parcels">' + esc(c.memo) + "</span>" : "") + "</li>").join("") : '<li class="notice-bar">등록된 연락처가 없어요. 시트의 \'연락처\' 탭에 적어 주세요.</li>';
  }
  function renderAll() { renderHome(); renderList(); renderContacts(); }

  /* ---------- 상세 ---------- */
  let sheetFor = null, lastFocus = null;
  function openSheet(id) { sheetFor = id; lastFocus = document.activeElement; document.body.classList.add("locked"); drawSheet(); }
  function closeSheet() { sheetFor = null; document.body.classList.remove("locked"); $("sheetRoot").innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function mapSection(L) {
    const head = "<div><h2>지도·토지이용계획</h2></div>";
    if (!L.addresses.length) return head + '<p class="notice-bar">지도 주소가 없어요. 시트의 \'지도 주소\' 칸에 한 줄에 하나씩 적어 주세요.</p>';
    return head + '<ul class="issue-list">' + L.addresses.map((a) => {
      const q = encodeURIComponent(a);
      const pnu = /^\d{19}$/.test(L.parcelCodes[a] || "") ? L.parcelCodes[a] : "";
      const eum = pnu
        ? '<a class="maplink" href="https://www.eum.go.kr/web/ar/lu/luLandDet.jsp?isNoScr=script&amp;mode=search&amp;pnu=' + pnu + '" target="_blank" rel="noopener">토지이음</a>'
        : '<a class="maplink" href="https://www.eum.go.kr" target="_blank" rel="noopener">토지이음 (주소로 검색)</a>';
      return '<li class="issue"><span class="addr">' + esc(a) + '</span><span class="btn-row">' + eum +
        '<a class="maplink" href="https://map.kakao.com/link/search/' + q + '" target="_blank" rel="noopener">카카오맵</a>' +
        '<a class="maplink" href="https://map.naver.com/p/search/' + q + '" target="_blank" rel="noopener">네이버지도</a>' +
        '<button type="button" class="mini" data-copy="' + esc(a) + '">주소 복사</button></span></li>';
    }).join("") + '</ul><p class="hint">토지이음에서는 용도지역, 농업진흥구역 여부, 지목, 면적을 볼 수 있어요.</p>';
  }
  function drawSheet() {
    const L = state.leases.find((x) => x.id === sheetFor);
    if (!L) { closeSheet(); return; }
    const k = KIND[L.kind] || KIND.idle;
    const ds = deadlines(L).map((d) => Object.assign(d, { n: diffDays(d.date) })).sort((a, b) => a.date - b.date);
    const area = Number(L.area);
    const c = checksFor(L);
    const body =
      (c.length ? '<div class="notice-bar err"><strong>살펴볼 것</strong><br>' + c.map(esc).join("<br>") + "</div>" : "") +
      '<dl class="info">' +
      '<dt>관리 유형</dt><dd><span class="pill ' + k.cls + '">' + k.label + "</span></dd>" +
      "<dt>지번</dt><dd>" + esc(L.parcels || "—") + "</dd>" +
      (area ? "<dt>면적</dt><dd>" + area.toLocaleString("ko-KR") + "㎡ (약 " + Math.round(area / 3.3058).toLocaleString("ko-KR") + "평)</dd>" : "") +
      "<dt>계약 기간</dt><dd>" + fmt(parseD(L.start)) + " – " + fmt(parseD(L.end)) + "</dd>" +
      "<dt>임차인</dt><dd>" + esc(L.tenant || "—") + (L.phone ? '<br><span class="phone-line"><span class="phone"><a href="' + esc(telHref(L.phone)) + '">' + esc(L.phone) + '</a></span><button type="button" class="mini" data-copy="' + esc(L.phone) + '">복사</button></span>' : "") + "</dd>" +
      (L.rent ? "<dt>임대료</dt><dd>" + esc(L.rent) + "</dd>" : "") +
      (L.kind === "private" ? "<dt>시설·다년생</dt><dd>" + (L.facility ? "있음 (최소 5년)" : "없음 (최소 3년)") + "</dd><dt>농지대장 신고</dt><dd>" + (L.reportedAt ? fmt(parseD(L.reportedAt)) + " 신고함" : "신고일 미입력") + "</dd>" : "") +
      (L.note ? "<dt>메모</dt><dd>" + esc(L.note).replace(/\n/g, "<br>") + "</dd>" : "") +
      "</dl>" +
      mapSection(L) +
      "<div><h2>날짜</h2></div>" +
      '<ul class="todo-list" style="margin-top:0">' + (ds.length ? ds.map((d) => '<li class="todo u-' + urgency(d.n) + '" style="cursor:default"><span class="dday">' + ddayText(d.n) + "<small>" + fmt(d.date) + '</small></span><span class="todo-title">' + esc(d.title) + '</span><span class="todo-plain">' + esc(d.n < 0 ? d.overPlain : d.plain) + '</span><span class="todo-plain">근거: ' + esc(d.basis) + "</span></li>").join("") : '<li class="notice-bar">계산할 날짜가 없어요. 시트에 계약 기간을 적어 주세요.</li>') + "</ul>" +
      "<div><h2>현장 기록</h2></div>" +
      '<ul class="issue-list">' + (L.issues.length ? L.issues.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).map((it) =>
        '<li class="issue"><span class="issue-top"><span>' + fmt(parseD(it.date)) + '</span><span class="' + (it.status === "done" ? "st-done" : "st-open") + '">' + (it.status === "done" ? "해결" : "처리 중") + "</span></span><span>" + esc(it.text) + "</span></li>").join("")
        : '<li class="notice-bar">기록이 없어요. 무단 시설, 방치, 임대료 미납 같은 일을 날짜와 함께 시트에 적어 두면 상담 때 근거가 돼요.</li>') + "</ul>" +
      '<div class="btn-row"><a class="btn ghost" href="' + esc(SHEET_EDIT) + '" target="_blank" rel="noopener">시트에서 고치기</a></div>';
    $("sheetRoot").innerHTML =
      '<div class="sheet-backdrop" data-close></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-inner">' +
      '<div class="sheet-head"><h1 id="sheetTitle">' + esc(L.region) + '</h1><button type="button" class="close" data-close>닫기</button></div>' +
      body + "</div></div>";
    const closeBtn = $("sheetRoot").querySelector(".close");
    if (closeBtn) closeBtn.focus();
  }

  /* ---------- 이벤트 ---------- */
  let toastTimer = null;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }
  function setStatus(msg, isErr) { const s = $("status"); s.hidden = !msg; s.textContent = msg || ""; s.classList.toggle("err", !!isErr); }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-open],[data-close],[data-copy],[data-filter]");
    if (!t) return;
    if (t.hasAttribute("data-open")) openSheet(t.getAttribute("data-open"));
    else if (t.hasAttribute("data-close")) closeSheet();
    else if (t.hasAttribute("data-filter")) { state.filter = t.getAttribute("data-filter"); renderList(); }
    else if (t.hasAttribute("data-copy")) {
      const val = t.getAttribute("data-copy");
      try { navigator.clipboard.writeText(val).then(() => toast("복사했어요"), () => toast("길게 눌러 복사해 주세요")); }
      catch (_) { toast("길게 눌러 복사해 주세요"); }
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetFor) closeSheet(); });
  $("refreshBtn").addEventListener("click", () => load("manual"));
  $("editSheetLink").href = SHEET_EDIT;

  /* ---------- 화면 전환 ---------- */
  const VIEWS = ["home", "list", "contacts"];
  function route() {
    const h = (location.hash || "").replace("#", "");
    const v = VIEWS.includes(h) ? h : "home";
    VIEWS.forEach((x) => { $("view-" + x).hidden = x !== v; });
    document.querySelectorAll("nav.tabs a").forEach((a) => { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => { if (sheetFor) closeSheet(); route(); });

  /* ---------- 글씨 크기 ---------- */
  const SIZES = [{ px: 18, label: "보통" }, { px: 21, label: "크게" }, { px: 24, label: "더 크게" }, { px: 28, label: "아주 크게" }];
  let sizeIdx = 1;
  try { const saved = Number(localStorage.getItem("farm-size-step")); if (saved >= 0 && saved < SIZES.length && localStorage.getItem("farm-size-step") !== null) sizeIdx = saved; } catch (_) {}
  function applySize() {
    document.documentElement.style.setProperty("--base", SIZES[sizeIdx].px + "px");
    $("sizeNow").textContent = SIZES[sizeIdx].label;
    $("sizeDown").disabled = sizeIdx === 0;
    $("sizeUp").disabled = sizeIdx === SIZES.length - 1;
    try { localStorage.setItem("farm-size-step", String(sizeIdx)); } catch (_) {}
  }
  $("sizeDown").addEventListener("click", () => { if (sizeIdx > 0) { sizeIdx--; applySize(); } });
  $("sizeUp").addEventListener("click", () => { if (sizeIdx < SIZES.length - 1) { sizeIdx++; applySize(); } });
  applySize();

  /* ---------- 시작 ---------- */
  const t = today0();
  $("today").textContent = "오늘 " + t.getFullYear() + "년 " + (t.getMonth() + 1) + "월 " + t.getDate() + "일";
  route(); renderAll();
  if (!SHEET_ID) setStatus("가족이 보내준 장부 링크로 한 번 열어 주세요. 그 뒤로는 이 휴대폰이 기억해요.", true); else load();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.loaded) load(true); });
  setInterval(() => { if (document.visibilityState === "visible" && state.loaded) load(true); }, 5 * 60000);
})();
</script>
</body>
</html>
